name: GitHub Classroom Workflow
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Lab1.sln

      - name: Build
        run: dotnet build Lab1.sln --no-restore -c Release

      - name: Run unit tests
        run: dotnet test Lab1.sln --no-build --no-restore -c Release

      # Деплой на Heroku через docker (без Heroku CLI и webhooks).
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@v3.13.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_EMAIL }}
          usedocker: true

      # Подставляем реальный адрес приложения в Postman-окружение перед интеграционными тестами.
      - name: Set Heroku baseUrl
        shell: bash
        run: |
          APP_URL="https://${{ secrets.HEROKU_APP_NAME }}.herokuapp.com"
          sed -i "s|https://your-app\.herokuapp\.com|$APP_URL|g" "postman/[inst][heroku] Lab1.postman_environment.json"

      - name: Run API Tests
        uses: matt-ball/newman-action@master
        with:
          collection: postman/[inst] Lab1.postman_collection.json
          environment: postman/[inst][heroku] Lab1.postman_environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true

      - name: Github auto grader mark
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{ secrets.GOOGLE_API_KEY }}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 1
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"