version: "3"
services:
  postgres:
    image: postgres:13
    container_name: lab1-postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      # Хост-порт 5433, чтобы не конфликтовать с уже занятым 5432 на этой машине.
      - "5433:5432"

volumes:
  db-data: